description: "Leia e analise as principais dúvidas do usuário a serem solucionadas a partir da pergunta: {question}"
expected_output: >
  Diagnóstico conciso das dúvidas em Markdown com até dois bullet points que precisam ser respondidos. 
  Faça isso, seguindo as seguintes diretrizes: se a pergunta do usuário for complexa ou contiver múltiplas demandas,
  extraia e priorize as 2 dúvidas mais críticas. Se a pergunta for simples e direta, retorne apenas um bullet point. 
  Em nenhuma hipótese invente, deduza ou adicione dúvidas que não estejam explicitamente presentes no texto original.