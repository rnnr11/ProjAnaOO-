
services:
  ollama:
    image: ollama/ollama
    container_name: ollama-local
    restart: "no"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - isolated
      - ollama_download
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  crewai:
    build:
      context: .
    container_name: crewai-local
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - isolated
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-600}
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128

networks:
  isolated:
    driver: bridge
    internal: true
  ollama_download:
    driver: bridge

volumes:
  ollama_data:
    external: true
    name: ollama_data