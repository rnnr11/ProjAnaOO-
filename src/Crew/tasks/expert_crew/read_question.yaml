description: >
  Leia e analise as principais dúvidas do usuário a serem solucionadas a partir
  da pergunta nunca realizando dissertações sobre o que for identificado: {question}
  A fim de fornecer informações dos conhecimentos atuais do aluno e do contexto geral da conversa,
  use o seguinte histórico de conversas como base:
  {history}
  Foque nas dúvidas presentes na pergunta atual ({question}); se o aluno mudou de dúvida em relação ao histórico,
  analise a dúvida atual sem arrastar demandas pendentes de perguntas anteriores.
expected_output: >
  Diagnóstico conciso das dúvidas em Markdown com bullet points que precisam ser respondidos.
  Os bullet points devem conter uma afirmação sobre o que o aluno não entende ou parece entender.
  Faça isso, seguindo as seguintes diretrizes: se a pergunta do usuário for complexa ou contiver múltiplas demandas, siga este formato: 
  - [extraia a brecha mais crítica no conhecimento do aluno em relação à pergunta de fundo].
  - [extraia a pergunta de fundo que o aluno fez, o contexto geral da pergunta].
  Em nenhuma hipótese invente, deduza ou adicione dúvidas que não estejam explicitamente presentes no texto original.
  Se a pergunta contiver o pedido de um exemplo, substitua o primeiro bullet point pelo exemplo que foi pedido e crie o segundo normalmente.