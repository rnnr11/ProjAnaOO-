description: >
  Analise a pergunta atual do estudante sobre Facade: {question}
  Histórico anterior da conversa: {conversation_history}
  Identifique a etapa pedagógica adequada: dúvida conceitual, pedido de exemplo, pedido de
  seleção/uso, tentativa do estudante, solicitação de solução pronta ou assunto fora do escopo.
  Registre somente dúvidas e equívocos sustentados pela pergunta e pelo histórico. Não responda
  pelo estudante nem invente detalhes. Este diagnóstico é interno e será usado pelas próximas
  tarefas para preparar uma única resposta coerente.
expected_output: >
  Diagnóstico interno conciso em Markdown: etapa da aprendizagem, dúvida ou tentativa
  explicitamente apresentada e a próxima ação pedagógica recomendada. Quando a pergunta estiver
  fora do escopo Facade ou pedir conteúdo inventado/solução pronta, indique a recusa orientada
  correspondente sem fabricar uma resposta técnica.